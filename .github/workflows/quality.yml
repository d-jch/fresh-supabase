name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.3"

      - name: Format
        run: deno task fmt

      - name: Type check
        run: deno task check

      - name: Lint
        run: deno task lint

      - name: Package dry run
        working-directory: packages/cli
        run: deno publish --dry-run

      - name: Test
        run: deno task test
